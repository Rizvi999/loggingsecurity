name: Java CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: 1234
          MYSQL_DATABASE: studentdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:mysql://localhost:3306/studentdb?useSSL=false&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: 1234

    defaults:
      run:
        working-directory: loggingsecurity

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: loggingsecurity/pom.xml

      - name: Build and Test
        run: ./mvnw --batch-mode clean verify

      - name: Generate JaCoCo Coverage Report
        run: ./mvnw --batch-mode jacoco:report

      - name: Check Code Coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          report = "target/site/jacoco/jacoco.xml"

          try:
              tree = ET.parse(report)
          except FileNotFoundError:
              print(f"ERROR: JaCoCo report not found: {report}")
              sys.exit(1)

          instruction_counter = next(
              (
                  counter
                  for counter in tree.getroot().findall("counter")
                  if counter.attrib.get("type") == "INSTRUCTION"
              ),
              None,
          )

          if instruction_counter is None:
              print("ERROR: INSTRUCTION coverage data not found.")
              sys.exit(1)

          missed = int(instruction_counter.attrib["missed"])
          covered = int(instruction_counter.attrib["covered"])
          total = missed + covered

          if total == 0:
              print("ERROR: No instructions found in JaCoCo report.")
              sys.exit(1)

          coverage = (covered / total) * 100
          print(f"Code Coverage: {coverage:.2f}%")
          print("Required Coverage: 90.00%")

          if coverage < 90:
              print("QUALITY GATE FAILED")
              print("Code coverage is below 90%.")
              sys.exit(1)

          print("QUALITY GATE PASSED")
          print("Code coverage is 90% or higher.")
          PY

      - name: SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          projectBaseDir: loggingsecurity
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Package JAR
        run: ./mvnw --batch-mode package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-application
          path: loggingsecurity/target/*.jar

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: loggingsecurity/target/site/jacoco
