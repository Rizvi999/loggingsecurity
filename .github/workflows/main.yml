name: Java CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      mysql:
        image: mysql:8.4
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: 1234
          MYSQL_DATABASE: studentdb
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: loggingsecurity

    steps:

      # -----------------------------------------
      # 1. Checkout source code
      # -----------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------
      # 2. Setup JDK 21
      # -----------------------------------------
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # -----------------------------------------
      # 3. Build and Run Unit Tests
      # -----------------------------------------
      - name: Build and Test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/studentdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: 1234
        run: |
          ./mvnw --batch-mode clean verify

      # -----------------------------------------
      # 4. Generate / Verify JaCoCo Coverage
      # -----------------------------------------
      - name: Generate JaCoCo Coverage Report
        run: |
          ./mvnw --batch-mode jacoco:report

      # -----------------------------------------
      # 5. Check Code Coverage >= 20%
      # -----------------------------------------
      - name: Check Code Coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import sys

          report = "target/site/jacoco/jacoco.xml"

          try:
              tree = ET.parse(report)
          except FileNotFoundError:
              print("ERROR: JaCoCo report not found:")
              print(report)
              sys.exit(1)

          root = tree.getroot()

          instruction_counter = None

          for counter in root.findall("counter"):
              if counter.attrib.get("type") == "INSTRUCTION":
                  instruction_counter = counter
                  break

          if instruction_counter is None:
              print("ERROR: INSTRUCTION coverage data not found.")
              sys.exit(1)

          missed = int(instruction_counter.attrib["missed"])
          covered = int(instruction_counter.attrib["covered"])

          total = missed + covered

          if total == 0:
              print("ERROR: No instructions found in JaCoCo report.")
              sys.exit(1)

          coverage = (covered / total) * 100

          print(f"Code Coverage: {coverage:.2f}%")
          print("Required Coverage: 20.00%")

          if coverage < 20:
              print("QUALITY GATE FAILED")
              print("Code coverage is below 20%.")
              sys.exit(1)

          print("QUALITY GATE PASSED")
          print("Code coverage is 20% or higher.")
          PY

      # -----------------------------------------
      # 6. SonarQube Analysis
      # -----------------------------------------
      # - name: SonarQube Analysis
      #   uses: SonarSource/sonarqube-scan-action@v7
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # # -----------------------------------------
      # # 7. SonarQube Quality Gate
      # # -----------------------------------------
      # - name: SonarQube Quality Gate
      #   uses: SonarSource/sonarqube-quality-gate-action@v1
      #   timeout-minutes: 10
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # -----------------------------------------
      # 8. Package Application
      # -----------------------------------------
      - name: Package JAR
        run: |
          ./mvnw --batch-mode package -DskipTests

      # -----------------------------------------
      # 10. Build Docker image
      # -----------------------------------------
      - name: Build Docker Image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          docker build \
            --tag loggingsecurity:ci \
            --tag "$IMAGE_NAME:${GITHUB_SHA}" \
            --tag "$IMAGE_NAME:latest" .
          docker save loggingsecurity:ci | gzip > target/loggingsecurity-image.tar.gz

      # -----------------------------------------
      # 11. Login to GitHub Container Registry
      # -----------------------------------------
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------
      # 12. Push Docker image to GHCR
      # -----------------------------------------
      - name: Push Docker Image
        if: github.event_name == 'push'
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:latest"

      # -----------------------------------------
      # 13. Upload JAR
      # -----------------------------------------
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-application
          path: loggingsecurity/target/*.jar

      # -----------------------------------------
      # 14. Upload Docker Image
      # -----------------------------------------
      - name: Upload Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: loggingsecurity-docker-image
          path: loggingsecurity/target/loggingsecurity-image.tar.gz

      # -----------------------------------------
      # 15. Upload JaCoCo Report
      # -----------------------------------------
      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: loggingsecurity/target/site/jacoco/